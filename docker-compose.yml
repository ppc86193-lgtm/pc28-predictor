# PC28 Prediction System Docker Compose
# Phase 7: Deployment

services:
  # Redis服务
  redis:
    image: redis:7.0-alpine
    container_name: pc28-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pc28-network

  # PC28预测应用
  app:
    build: .
    container_name: pc28-predictor
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
      - WORKERS=4
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pc28-network
    restart: unless-stopped

  # Celery Worker (任务队列)
  celery-worker:
    build: .
    container_name: pc28-celery-worker
    command: celery -A task_manager worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    networks:
      - pc28-network
    restart: unless-stopped

  # Prometheus监控 (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: pc28-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - pc28-network
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:

networks:
  pc28-network:
    driver: bridge