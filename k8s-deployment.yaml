# Kubernetes部署清单
# Phase 7: Deployment - Kubernetes Configuration

apiVersion: v1
kind: Namespace
metadata:
  name: pc28-predictor

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pc28-config
  namespace: pc28-predictor
data:
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
  WORKERS: "4"

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: pc28-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes"]
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: pc28-predictor
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

---
# Redis PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: pc28-predictor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# PC28 Predictor Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pc28-predictor-deployment
  namespace: pc28-predictor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pc28-predictor
  template:
    metadata:
      labels:
        app: pc28-predictor
    spec:
      containers:
      - name: pc28-predictor
        image: pc28-predictor:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: pc28-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
# PC28 Predictor Service
apiVersion: v1
kind: Service
metadata:
  name: pc28-predictor-service
  namespace: pc28-predictor
spec:
  selector:
    app: pc28-predictor
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  type: LoadBalancer

---
# Celery Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-deployment
  namespace: pc28-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: pc28-predictor:latest
        command: ["celery", "-A", "task_manager", "worker", "--loglevel=info", "--concurrency=2"]
        envFrom:
        - configMapRef:
            name: pc28-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pc28-predictor-hpa
  namespace: pc28-predictor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pc28-predictor-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80